<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>essentia.js analysis harness</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; }
    .row { margin: 16px 0; }
    input[type="file"] { display: block; margin-top: 6px; }
    input[type="text"] { width: 120px; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
    #status { color: #666; font-style: italic; }
    table { border-collapse: collapse; margin-top: 12px; width: 100%; }
    td, th { border: 1px solid #ccc; padding: 6px 10px; text-align: left; font-size: 0.9rem; }
    th { background: #f0f0f0; }
    .diff-ok { color: green; }
    .diff-bad { color: #c00; font-weight: bold; }
    #results { margin-top: 24px; }
  </style>
</head>
<body>
  <h1>essentia.js Analysis Harness (Phase 1)</h1>
  <p>Drop a local audio file in, optionally enter known ground-truth BPM/key, and compare against essentia.js's estimate.</p>

  <div class="row">
    <label for="fileInput">Audio file:</label>
    <input type="file" id="fileInput" accept="audio/*" />
  </div>

  <div class="row">
    <label>Known BPM (optional): <input type="text" id="knownBpm" placeholder="e.g. 128" /></label>
  </div>
  <div class="row">
    <label>Known Key (optional): <input type="text" id="knownKey" placeholder="e.g. A minor" /></label>
  </div>

  <div class="row">
    <button id="analyzeBtn" disabled>Analyze</button>
    <span id="status"></span>
  </div>

  <div id="results"></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
